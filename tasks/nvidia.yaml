# install nvidia drivers
# https://idroot.us/install-nvidia-drivers-fedora-42/
- name: Install NVIDIA drivers
  ansible.builtin.dnf:
    name:
      - akmod-nvidia
      - xorg-x11-drv-nvidia-cuda
      - xorg-x11-drv-nvidia-power # for suspend
      - libva-nvidia-driver # hardware accelerated codec
      - nvtop # NVIDIA GPU monitoring tool
    state: present
  become: true
  when: "'NVIDIA' in lspci_output.stdout"

- name: Enable nvidia-{suspend,resume,hibernate} services
  ansible.builtin.systemd:
    name: "nvidia-{{ item }}.service"
    enabled: true
  loop:
    - suspend
    - resume
    - hibernate
  become: true
  when: "'NVIDIA' in lspci_output.stdout"
