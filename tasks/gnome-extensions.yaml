- name: Install gnome-extensions-cli
  ansible.builtin.pip:
    name: gnome-extensions-cli
    state: latest
    executable: pip3
    extra_args: --user

- name: Install GNOME extensions
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.local/bin/gext install {{ item }}"
  loop:
    - dash-to-dock@micxgx.gmail.com
    - randomwallpaper@iflow.space
    - blur-my-shell@aunetx
    - accent-directories@taiwbi.com
  environment:
    HOME: "{{ ansible_facts['user_dir'] }}"
  changed_when: false
