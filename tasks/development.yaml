# dev packages
- name: Install dev packages with dnf
  ansible.builtin.dnf:
    name:
      - android-tools
      - gcc
      - make
      - zlib-devel
      - bzip2
      - bzip2-devel
      - readline-devel
      - sqlite
      - sqlite-devel
      - openssl-devel
      - xz
      - xz-devel
      - libffi-devel
      - findutils
      - tk-devel
      - libuuid-devel
    state: present
  become: true

# install pyenv
- name: Check if pyenv is already installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.pyenv/bin/pyenv"
  register: pyenv_binary

- name: Install pyenv via official installer
  ansible.builtin.shell: "curl -fsSL https://pyenv.run | bash"
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ansible_facts['user_dir'] }}"
    PYENV_ROOT: "{{ ansible_facts['user_dir'] }}/.pyenv"
  when: not pyenv_binary.stat.exists

- name: Update pyenv
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.pyenv/bin/pyenv update"
  changed_when: false

- name: Ensure pyenv root is exported in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: "export PYENV_ROOT=\"{{ ansible_facts['user_dir'] }}/.pyenv\""
    create: true

- name: Add pyenv bin to PATH in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
    create: true

- name: Initialize pyenv in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: 'eval "$(pyenv init -)"'
    create: true

- name: Initialize pyenv-virtualenv in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: 'eval "$(pyenv virtualenv-init -)"'
    create: true

- name: Ensure pyenv root is exported in .bash_profile
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bash_profile"
    line: "export PYENV_ROOT=\"{{ ansible_facts['user_dir'] }}/.pyenv\""
    create: true

- name: Add pyenv bin to PATH in .bash_profile
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bash_profile"
    line: '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
    create: true

- name: Initialize pyenv in .bash_profile
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bash_profile"
    line: 'eval "$(pyenv init -)"'
    create: true

- name: Initialize pyenv-virtualenv in .bash_profile
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bash_profile"
    line: 'eval "$(pyenv virtualenv-init -)"'
    create: true

- name: Reload shell to apply changes
  ansible.builtin.shell: exec "$SHELL"
  args:
    executable: /bin/bash
  changed_when: false

# install uv
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin"
    state: directory
    mode: '0755'

- name: Run uv standalone installer
  ansible.builtin.shell: "curl -LsSf https://astral.sh/uv/install.sh | sh"
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ansible_facts['user_dir'] }}"
  register: uv_installer
  changed_when: uv_installer.rc == 0 and "'uv' installed" in uv_installer.stdout

- name: Fail if uv installer returned an error
  ansible.builtin.fail:
    msg: "uv installation failed: {{ uv_installer.stderr }}"
  when: uv_installer.rc != 0

- name: Add ~/.local/bin to PATH in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    create: true
    state: present

- name: Enable uv bash completion
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: 'eval "$(uv generate-shell-completion bash)"'
    create: true
    state: present

# install docker
# https://docs.docker.com/engine/install/fedora/
- name: Add Docker repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  become: true

- name: Install Docker packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true

# install container-toolkit
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#installation
- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
    dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
    mode: '0644'
  become: true
  when: "'NVIDIA' in lspci_output.stdout"

- name: Install NVIDIA container toolkit
  ansible.builtin.dnf:
    name:
      - nvidia-container-toolkit
      - nvidia-container-toolkit-base
      - libnvidia-container-tools
      - libnvidia-container1
    state: present
  become: true
  when: "'NVIDIA' in lspci_output.stdout"

- name: Check if NVIDIA runtime is configured for Docker
  ansible.builtin.command:
    cmd: grep -q '"nvidia"' /etc/docker/daemon.json
  register: nvidia_docker_check
  changed_when: false
  failed_when: false
  when: "'NVIDIA' in lspci_output.stdout"

- name: Configure NVIDIA runtime for Docker
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime=docker
  become: true
  notify: Restart Docker
  when: "'NVIDIA' in lspci_output.stdout and nvidia_docker_check.rc != 0"

# finalize docker installation
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true

# install kubectl
# https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/
- name: Set Kubernetes release series for the package repository
  ansible.builtin.set_fact:
    kubernetes_release: v1.36

- name: Add Kubernetes repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_release }}/rpm/"
    gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_release }}/rpm/repodata/repomd.xml.key"
    gpgcheck: true
    enabled: true
  become: true

- name: Install kubectl
  ansible.builtin.dnf:
    name: kubectl
    state: present
    update_cache: true
  become: true

- name: Enable kubectl bash completion
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: 'source <(kubectl completion bash)'
    create: true

- name: Add kubectl alias to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: 'alias k=kubectl'
    create: true

- name: Enable bash completion for the kubectl alias
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: 'complete -o default -F __start_kubectl k'
    create: true

# install kind
# https://kind.sigs.k8s.io/docs/user/quick-start/#installing-from-release-binaries
# installed from the release binary, not dnf: the Fedora kind package requires
# the docker-cli capability, which docker-ce-cli does not provide
- name: Install kind
  ansible.builtin.get_url:
    url: https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
    dest: /usr/local/bin/kind
    checksum: sha256:50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
    owner: root
    group: root
    mode: '0755'
  become: true
