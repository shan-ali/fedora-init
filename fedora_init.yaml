---
- name: Initialize Fedora Workstation
  hosts: localhost
  connection: local
  gather_facts: yes
  become: no
  vars:
    current_user_name: "shan"
    user_home: "/home/{{ current_user_name }}"
    pyenv_root: "{{ user_home }}/.pyenv"
  tasks:

    - name: Display the Fedora version
      debug:
        msg: "{{ ansible_facts['distribution_major_version'] }}"

    - name: Detect PCI devices
      ansible.builtin.command: lspci
      register: lspci_output
      changed_when: false
      failed_when: false

    - name: Install dnf-plugins-core
      dnf:
        name: dnf-plugins-core
        state: present
      become: yes

    # install RPM Fusion repositories
    # https://rpmfusion.org/Configuration
    - name: Install Free and Nonfree Repositories for RPM Fusion
      dnf:
        name:
          - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
          - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
        state: present
      become: yes

    - import_tasks: tasks/codecs.yaml
    - import_tasks: tasks/nvidia.yaml
    - import_tasks: tasks/packages.yaml
    - import_tasks: tasks/vscode.yaml
    - import_tasks: tasks/brave.yaml
    # - import_tasks: tasks/development.yaml
    # - import_tasks: tasks/gnome.yaml
